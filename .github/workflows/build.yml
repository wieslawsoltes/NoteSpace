name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: notespace-source
          include-hidden-files: true
          path: |
            src/
            tests/
            docs/
            build/
            .github/
            global.json
            Directory.Build.props
            NoteSpace.slnx
            README.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            .editorconfig
            .gitignore
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run portable and rendering specifications
        shell: bash
        run: |
          mkdir -p artifacts/qa
          dotnet run --project tests/NoteSpace.Tests -c Release 2>&1 | tee artifacts/qa/portable-tests.log
          dotnet run --project tests/NoteSpace.Rendering.Tests -c Release 2>&1 | tee artifacts/qa/rendering-tests.log
      - name: Measure current CPU performance
        shell: bash
        run: dotnet run --project tests/NoteSpace.Benchmarks -c Release -- artifacts/qa/bench-current.json "$GITHUB_SHA"
      - name: Check out performance baseline
        uses: actions/checkout@v4
        with:
          ref: b75a27778e0e1209e28e6a01ad30b4b0119a79c2
          path: artifacts/benchmark-baseline
          persist-credentials: false
      - name: Compare the same benchmark runner against the baseline
        shell: bash
        run: |
          mkdir -p artifacts/benchmark-baseline/tests/NoteSpace.Benchmarks
          cp tests/NoteSpace.Benchmarks/*.cs tests/NoteSpace.Benchmarks/*.csproj artifacts/benchmark-baseline/tests/NoteSpace.Benchmarks/
          dotnet run --project artifacts/benchmark-baseline/tests/NoteSpace.Benchmarks -c Release -- "$PWD/artifacts/qa/bench-baseline.json" b75a277
          python3 tests/NoteSpace.Benchmarks/compare.py artifacts/qa/bench-baseline.json artifacts/qa/bench-current.json artifacts/qa/performance.md
          cat artifacts/qa/performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish browser application
        run: dotnet publish src/NoteSpace.App/NoteSpace.App.csproj -c Release -f net10.0-browserwasm -o artifacts/publish -p:WasmShellWebAppBasePath=/NoteSpace/
      - name: Stage static site
        shell: bash
        run: |
          INDEX=$(find artifacts/publish -name index.html -not -path '*/node_modules/*' | head -1)
          test -n "$INDEX"
          mkdir -p artifacts/site
          cp -a "$(dirname "$INDEX")/." artifacts/site/
          touch artifacts/site/.nojekyll
          test -f artifacts/site/index.html
      - name: Upload browser build for verification
        uses: actions/upload-artifact@v4
        with:
          name: notespace-browser-build
          path: artifacts/site/
          include-hidden-files: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          cd tests/browser && npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: |
          node --test tests/browser/host-keyboard.test.mjs
          node tests/browser/smoke.mjs
      - name: Upload browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notespace-browser-qa
          path: artifacts/qa/
          if-no-files-found: ignore
      - name: Build desktop application
        run: dotnet build src/NoteSpace.App/NoteSpace.App.csproj -c Release -f net10.0-desktop
      - name: Pack reusable libraries
        shell: bash
        run: |
          for name in Core Editor Storage Rendering.Skia Controls; do
            dotnet pack "src/NoteSpace.$name/NoteSpace.$name.csproj" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notespace-packages
          path: artifacts/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: notespace-browser
          path: artifacts/site/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: artifacts/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
